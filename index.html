<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART FUND</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

     <!-- Header -->
    <header class="header">
        <h1>SMARTFUND</h1>

        <div class="currency-selector">
            <label for="display-currency">Currency:</label>
            <select id="display-currency" name="display-currency">
                <option value="KES">KES</option>
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
                <option value="GBP">GBP</option>
            </select>
        </div>
    </header>

    <main class="main-content">

        <!-- Dashboard heading -->
        <section class="dashboard-heading">
            <h3>Track Your Expenses The Smart Way With SmartFund</h3>
        </section>

        <!-- Summary cards -->
        <section class="summary-section">
            <h2>Overview</h2>

            <div class="summary-grid">
                <article class="summary-card">
                    <h3>Total Balance</h3>
                    <p id="total-balance">KES 0.00</p>
                </article>

                <article class="summary-card">
                    <h3>Total Income</h3>
                    <p id="total-income">KES 0.00</p>
                </article>

                <article class="summary-card">
                    <h3>Total Expenses</h3>
                    <p id="total-expenses">KES 0.00</p>
                </article>
            </div>
        </section>
    
</body>
</html>
